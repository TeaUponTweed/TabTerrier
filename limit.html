<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab limit reached</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="page.css" />
</head>
<body>
  <main>
    <img class="mark" src="icons/icon-96.png" alt="" />
    <h1>TabTerrier</h1>
    <p class="tagline">caught this one.</p>

    <p id="message">You're at your limit.</p>
    <p class="detail">Close a tab you're done with, or pause the limit below.</p>

    <p class="countdown" id="countdown" aria-live="polite"></p>

    <div class="actions">
      <button id="close-now">Close now</button>
      <button id="keep-open" class="ghost">Stop the countdown</button>
    </div>

    <form class="pause-form" id="pause-form">
      <select name="minutes" aria-label="Pause duration">
        <option value="5">5 min</option>
        <option value="15" selected>15 min</option>
        <option value="30">30 min</option>
        <option value="60">1 hour</option>
      </select>
      <input name="note" placeholder="Why are you pausing?" aria-label="Reason for pausing" required />
      <button>Pause limit</button>
    </form>

    <p id="error" role="alert"></p>
  </main>
  <script src="limit.js"></script>
</body>
</html>
