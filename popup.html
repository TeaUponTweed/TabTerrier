<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TabTerrier</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" />
    <h1>TabTerrier</h1>
  </header>

  <section id="block">
    <h2>Site blocking</h2>
    <p class="status" role="status"></p>

    <div class="pause" data-feature="block">
      <div class="paused-view">
        <p class="remaining" aria-live="polite"></p>
        <p class="note"></p>
        <button class="resume">Resume now</button>
      </div>
      <form class="pause-form">
        <select name="minutes" aria-label="Pause duration">
          <option value="5">5 min</option>
          <option value="15" selected>15 min</option>
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
        </select>
        <input name="note" placeholder="Why are you pausing?" aria-label="Reason for pausing" required />
        <button>Pause</button>
      </form>
    </div>

    <form id="add-site" class="row">
      <input name="site" placeholder="example.com" aria-label="Site to block" required />
      <button>Add</button>
    </form>
    <button id="add-current" class="secondary">Block the current site</button>

    <form id="remove-site">
      <div class="row">
        <input name="site" placeholder="Type a site to unblock" aria-label="Site to unblock" required />
      </div>
      <div class="row">
        <input name="note" placeholder="Why are you unblocking it?" aria-label="Reason for unblocking" required />
        <button class="ghost">Unblock</button>
      </div>
    </form>
    <p id="notice" role="status"></p>
  </section>

  <section id="tabs">
    <h2>Tab limit</h2>
    <p class="status" role="status"></p>

    <form id="limit-form" class="row">
      <input type="number" id="limit" name="limit" min="1" aria-label="Maximum open tabs" />
      <button>Save limit</button>
    </form>

    <div class="pause" data-feature="tabs">
      <div class="paused-view">
        <p class="remaining" aria-live="polite"></p>
        <p class="note"></p>
        <button class="resume">Resume now</button>
      </div>
      <form class="pause-form">
        <select name="minutes" aria-label="Pause duration">
          <option value="5">5 min</option>
          <option value="15" selected>15 min</option>
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
        </select>
        <input name="note" placeholder="Why are you pausing?" aria-label="Reason for pausing" required />
        <button>Pause</button>
      </form>
    </div>
  </section>

  <section id="history">
    <h2>Your notes</h2>
    <ul id="log"></ul>
    <button id="show-all" class="secondary" hidden></button>
  </section>

  <p id="error" role="alert"></p>
  <script src="constants.js"></script>
  <script src="time.js"></script>
  <script src="popup.js"></script>
</body>
</html>
